<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ангара Кофе — прототип</title>
<style>
:root{--bg:#0e1411;--card:#17201b;--card2:#1e2a23;--line:#2a3a30;--tx:#e9f1eb;--mut:#8ea396;--g:#35c26a;--g2:#1f7a45;--o:#ffb02e;--r:#ff5d5d;--y:#f2c94c;--b:#4aa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a08;color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:390px;height:min(820px,100vh);background:var(--bg);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 8px #151a17,0 20px 60px #000}
@media(max-width:430px){#app{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
.top{padding:16px 16px 10px;background:linear-gradient(#17261e,var(--bg));position:relative}
.trow{display:flex;align-items:flex-start;gap:10px}
.top h1{margin:0;font-size:20px;line-height:1.2;flex:1;min-width:0;padding-top:5px}.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
.tact{display:flex;align-items:center;gap:8px;flex:none}
.bell{position:relative;flex:none;width:38px;height:34px;background:var(--card2);border:1px solid var(--line);border-radius:20px;color:var(--tx);font-size:16px;cursor:pointer;padding:0}
.bell i{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--r);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.logout{display:flex;align-items:center;gap:5px;max-width:112px;height:34px;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:0 11px;font-size:12px;cursor:pointer}
.logout span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{flex:1;overflow-y:auto;padding:4px 14px 16px}
.tabs{display:flex;background:#111a15;border-top:1px solid var(--line);overflow:hidden}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:1 1 0;min-width:0;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:9.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tabs button b{display:flex;justify-content:center}
.bottles{display:flex;gap:6px;justify-content:space-between;margin-top:10px}
.bt{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);cursor:pointer}
.bt.ro{cursor:default}
.bt svg{width:100%;max-width:44px;height:auto}
.tb{position:absolute;top:3px;left:calc(50% + 5px);min-width:15px;height:15px;border-radius:8px;background:var(--r);color:#fff;font-size:9px;font-style:normal;font-weight:700;line-height:15px;text-align:center;padding:0 3px}
@media(max-width:370px){.tabs button{font-size:8.5px}}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;margin:7px 0;font-size:14px;line-height:1.35;word-break:break-word}
.msg.me{background:var(--g2);margin-left:auto;border-bottom-right-radius:4px}.msg.them{background:var(--card2);border-bottom-left-radius:4px}
.msg .mt{font-size:10.5px;opacity:.65;margin-top:3px}
.tabs button b{display:block;font-size:18px;margin-bottom:2px}
.tabs button.on{color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t1{font-weight:600;font-size:15px}.t2{color:var(--mut);font-size:12.5px;margin-top:2px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dg{background:var(--g)}.dy{background:var(--y)}.dr{background:var(--r)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;font-weight:700;font-size:14px;padding:0 6px;flex:none}
.b1{background:#24402f;color:#7be3a0}.b2{background:#4a3a14;color:var(--o)}.b3{background:#3a2a55;color:#c9a8ff}
.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.warn{background:#4a2a14;color:var(--o)}.pill.bad{background:#4a1a1a;color:#ff8f8f}.pill.ok{background:#17402a;color:#7be3a0}.pill.blue{background:#16304a;color:#8cc4ff}
.btn{background:var(--g);color:#06150c;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;width:100%;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btns{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.photo:has(svg){cursor:zoom-in}
input[type=text],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--tx);font-size:14px;margin:6px 0}
.bar{height:6px;background:#26342b;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 0;font-size:12px;cursor:pointer}
.seg button.on{background:var(--g2);color:#fff;border-color:var(--g)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:17px;cursor:pointer}
.step span{min-width:44px;text-align:center;font-weight:600}
.days{display:flex;gap:5px;margin:8px 0}
.days button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 0;font-size:12px;cursor:pointer}
.days button.on{background:var(--g2);color:#fff;border-color:var(--g)}
.days button small{display:block;font-size:10px;opacity:.8}
.days button.today{border-color:var(--o)}
.chips{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--g2);color:#fff;border-color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#06150c;font-weight:900;cursor:pointer}
.box.on{background:var(--g);border-color:var(--g)}
.dis{opacity:.4;pointer-events:none}
.overlay{position:absolute;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;border-top:1px solid var(--line)}
.sheet h2{margin:0 0 8px;font-size:18px}
.prog{display:flex;gap:6px;padding:0 14px 6px}.prog i{flex:1;height:4px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--g)}
.cam{position:absolute;inset:0;background:#000;z-index:8;display:flex;flex-direction:column}
.vf{flex:1;position:relative;background:radial-gradient(#3b4a42,#101512);display:flex;align-items:center;justify-content:center}
.vf .hint{position:absolute;top:12px;left:12px;right:12px;background:#000a;border-radius:10px;padding:8px 10px;font-size:12.5px}
.vf .ref{position:absolute;right:10px;bottom:10px;width:84px;background:#0009;border:1px solid #fff4;border-radius:8px;padding:4px;font-size:10px;text-align:center}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ddd;margin:14px auto;cursor:pointer}
.photo{border-radius:10px;overflow:hidden;position:relative;background:#222;border:1px solid var(--line)}
.stamp{position:absolute;left:6px;bottom:6px;font-size:9.5px;background:#000a;padding:2px 6px;border-radius:6px;color:#cfe}
h3{margin:16px 2px 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.back{background:none;border:0;color:var(--g);font-size:14px;padding:0;margin-bottom:6px;cursor:pointer}
.tiny{font-size:11.5px;color:var(--mut)}
a.mapbtn{display:block;text-decoration:none;color:var(--tx)}
.nav{background:linear-gradient(135deg,#17402a,#13261c);border:1px solid var(--g2);border-radius:16px;padding:14px;margin:8px 0}
.big{font-size:26px;font-weight:800}
.login{flex:1;display:flex;flex-direction:column;padding:26px;gap:12px;overflow-y:auto}
.login>:first-child{margin-top:auto}.login>:last-child{margin-bottom:auto}
.login h1{margin:0 0 4px;font-size:26px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// версия содержимого приложения: увеличивайте при каждом выпуске обновления (по ней приложение понимает, что вышла новая)
const APP_VERSION = 3;
/* ===================== ФИРМЕННЫЕ ИКОНКИ «АНГАРА КОФЕ» ===================== */

const TODAY = 2;
const DEPOT = {name:'База (склад)', addr:'Красноказачья, 85', lat:52.2750, lon:104.3200};
const COUR = [{id:1, name:'Алексей', login:'alex', pass:'1234', active:true, r1:600, r2:1100, r3:2000}, {id:2, name:'Мария', login:'maria', pass:'1234', active:true, r1:600, r2:1100, r3:2000}];

const MGR = {login:'manager', pass:'admin'};
let CITY = '';
const PTS_SRC = [
  // [название, адрес, [дизайны станций], окно визита, особые задачи, lat, lon] (координаты условные, нужны только для оценки расстояний)

  let h = `<div class="overlay" style="align-items:flex-start" onclick="if(event.target===this)closeShade()"><div class="sheet" style="border-radius:0 0 20px 20px;border-top:0;border-bottom:1px solid var(--line);max-height:84%">
    <div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">Уведомления</h2><button class="btn sec sm" onclick="clearNotifs()">Очистить</button><button class="btn sm" onclick="closeShade()">${ic('x', 16)}</button></div>`;
  if (!list.length) h += '<div class="card t2">Новых уведомлений нет.</div>';
  list.forEach(n => {
    const r = n.rv, p = r ? pt(r.pid) : null;
    h += `<div class="card" style="${n.read ? '' : 'border-color:var(--g)'}"><div class="row" style="align-items:flex-start"><div style="color:${n.kind === 'redo' ? 'var(--o)' : 'var(--g)'}">${ic(n.kind === 'photo' ? 'camera' : n.kind === 'ok' ? 'check' : n.kind === 'chat' ? 'chat' : n.kind === 'water' ? 'drop' : 'warn', 24)}</div>
      <div class="grow"><div class="t1" style="font-size:14px">${n.text}</div><div class="t2">${n.t}</div></div></div>`;
    if (r) {
      h += `<div class="row" style="margin-top:8px;align-items:flex-start"><div class="photo" style="width:64px;height:100px">${r.photo ? r.photo.svg : stationSVG(pst(p))}</div>
        ${r.type >= 2 ? `<div class="photo" style="width:64px;height:86px">${r.nozzle ? r.nozzle.svg : nozzleSVG(false, true)}</div>` : ''}
        <div class="grow tiny">${r.arrive ? 'Чистота: ' + CLEAN[r.arrive.clean] + '<br>Урна: ' + Math.round(r.arrive.trash * 100) + '%' : 'Тип визита: ' + tl(r.type)}</div></div>`;
      h += r.status === 'pending'
        ? `<div class="btns" style="margin-bottom:0"><button class="btn sm" onclick="rv(${r.id},'ok')">Принять</button><button class="btn sec sm" onclick="askRedo(${r.id})">Переснять</button><button class="btn sec sm" onclick="askComment(${r.id})">${ic('chat', 15)} Комментарий</button><button class="btn sec sm" onclick="closeShade();go({tab:'mgr',view:null})">Открыть</button></div>`
        : `<div style="margin-top:8px"><span class="pill ${r.status === 'ok' ? 'ok' : 'bad'}">${r.status === 'ok' ? 'принято' : 'отправлено на пересъёмку'}</span></div>`;
    }
    if (n.kind === 'redo') h += `<div class="btns" style="margin-bottom:0"><button class="btn sm" onclick="closeShade();openPoint(${n.pid})">Открыть точку</button></div>`;
    if (n.kind === 'chat') h += `<div class="btns" style="margin-bottom:0"><button class="btn sm" onclick="openChatFrom(${n.cid})">Ответить в чате</button></div>`;
    h += '</div>';
  });
  return h + '</div></div>';
}

  <button class="btn" onclick="doLogin()">Войти</button>
  <div class="tiny" style="margin-top:8px">Демо-доступы: ${MGR.pass === 'admin' ? 'менеджер — manager / admin' : 'менеджер — manager (пароль изменён вами)'}, курьер — alex / 1234 или maria / 1234. Роль определяется аккаунтом, менеджер создаёт курьеров на вкладке «Курьеры».</div></div>`;

function doLogout() { go({role:null, view:null, sheet:null, shade:false, cam:null, visit:null, viewer:null}); }
function changePass() {
  const f = S.pw;
  if (f.old !== MGR.pass) f.err = 'Текущий пароль указан неверно';
  else if (f.n1.length < 6) f.err = 'Новый пароль должен быть не короче 6 символов';
  else if (f.n1 === f.old) f.err = 'Новый пароль совпадает со старым';
  else if (f.n1 !== f.n2) f.err = 'Пароли не совпадают';
  else {
    MGR.pass = f.n1; saveAll();
    const k = ACCS.findIndex(a => a.login.toLowerCase() === MGR.login); if (k >= 0) { ACCS[k].pass = MGR.pass; saveAccs(); }
    return go({sheet:null, pw:null, toast:'Пароль изменён'});
  }
  render();
}
function doLogin() {
  const l = S.lg.login.trim().toLowerCase(), p = S.lg.pass;
  const rem = S.lg.rem !== false;
  if (l === MGR.login && p === MGR.pass) { if (rem) rememberAcc(MGR.login, MGR.pass, 'Менеджер', 'mgr'); S.lg = {login:'', pass:'', err:''}; return login('mgr'); }
  const c = COUR.find(x => x.login.toLowerCase() === l && x.pass === p);
  if (!c) { S.lg.err = 'Неверный логин или пароль'; return render(); }
  if (!c.active) { S.lg.err = 'Аккаунт отключён, обратитесь к менеджеру'; return render(); }
  if (rem) rememberAcc(c.login, c.pass, c.name, 'cour');
  S.lg = {login:'', pass:'', err:''}; login('cour', c.id);
}
// сохранённые аккаунты хранятся только на этом телефоне (отдельно от данных приложения)
function rememberAcc(login, pass, name, role) {
  const i = ACCS.findIndex(a => a.login.toLowerCase() === login.toLowerCase()), a = {login, pass, name, role};
  if (i >= 0) ACCS[i] = a; else ACCS.push(a);
  saveAccs();
}
const isRemembered = login => ACCS.some(a => a.login.toLowerCase() === login.toLowerCase());
function useAcc(i) { const a = ACCS[i]; S.lg.login = a.login; S.lg.pass = a.pass; S.lg.err = ''; render(); }
function unpinAcc(i) { ACCS.splice(i, 1); saveAccs(); render(); }
function toggleAcc() {
  const mgr = S.role === 'mgr', login = mgr ? MGR.login : cr(S.me).login;
  const i = ACCS.findIndex(a => a.login.toLowerCase() === login.toLowerCase());
  if (i >= 0) { ACCS.splice(i, 1); saveAccs(); go({toast:'Аккаунт откреплён'}); }
  else { rememberAcc(login, mgr ? MGR.pass : cr(S.me).pass, mgr ? 'Менеджер' : cr(S.me).name, S.role); go({toast:'Аккаунт запомнен на этом телефоне'}); }
}

      <button class="btn sec sm" onclick="doOpt()">Построить по ближайшим</button></div></div>`;
    h += `<div class="row" style="margin:6px 2px"><div class="grow tiny">Осталось ${lg.out.length} точек · ${lg.tot.toFixed(1)} км · ≈ ${Math.floor(mins / 60)} ч ${mins % 60} мин</div></div>`;
    h += `<div class="btns" style="margin-top:0"><button class="btn sec sm" onclick="go({sheet:'load'})">Погрузка</button><button class="btn sec sm" onclick="go({sheet:'map'})">Весь маршрут в картах</button></div>`;
  } else h += '<div class="card"><div class="t1">Маршрут выполнен</div><div class="t2">Все точки на сегодня сданы.</div></div>';
  let prev = posOf(c), n = 0;
  list.forEach(x => {
    const p = pt(x.pid), d = km(prev, p); if (!x.done) { n++; prev = p; }
    h += `<div class="card" onclick="openPoint(${p.id})" style="${x.done ? 'opacity:.55' : ''}"><div class="row">

const shortNeed = p => { const a = ING.map(g => [g, needBase(p, g)]).filter(x => x[1] > 0).slice(0, 4); return a.length ? a.map(x => x[0].n.toLowerCase() + ' ' + x[1]).join(', ') : 'всё в норме'; };

const CHK1 = ['Вынести мусор, поменять пакет', 'Протереть столешницу, фасад и дверцы', 'Проверить сиропную станцию и дозаторы: сироп льётся спокойно, дозаторы не заедают', 'Промыть миксеры через меню', 'Проверить, что все ингредиенты выложены'];
const CHK3 = ['Вымыть станцию внутри и снаружи, включая ячейки для засыпания и носики', 'Разобрать и вымыть зону сиропов, дозаторы и поддоны', 'Навести порядок в подтоварке, проверить сроки годности', 'Вымыть пол и пространство вокруг станции', 'Вымыть и обработать урну'];
const CHK2 = ['Снять миксеры и промыть их с разбором', 'Проверить чистоту кофейни со всех сторон', 'Очистить зону сиропов', 'Собрать миксеры и запустить промывку через меню'];
function startVisit(id, quick) {
  const p = pt(id), item = L(S.me, TODAY).find(x => x.pid === id);

  if (done) return {t:'В пути', cls:'blue', n, done, info:'последняя сдача: ' + pt(l.filter(x => x.done).pop().pid).name};
  return loaded ? {t:'Загрузился', cls:'warn', n, done, info:'забрал ингредиенты на базе'} : {t:'Ещё на базе', cls:'bad', n, done, info:'погрузка не подтверждена'};

const genPass = () => Array.from({length:6}, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 31)]).join('');
function openCF(id) {
  const c = id ? cr(id) : null;
  go({sheet:'cform', cf:c ? {id, name:c.name, login:c.login, pass:c.pass, r1:c.r1, r2:c.r2, r3:c.r3, err:''} : {id:null, name:'', login:'', pass:genPass(), r1:600, r2:1100, r3:2000, err:''}});
}
const cfRate = (k, d) => { S.cf[k] = Math.max(0, S.cf[k] + d); render(); };
function saveCF() {
  const f = S.cf, name = f.name.trim(), login = f.login.trim();
  if (!name) f.err = 'Укажите имя курьера';
  else if (!/^[A-Za-z0-9_.-]{3,}$/.test(login)) f.err = 'Логин: от 3 символов, латиница, цифры, . _ -';
  else if (COUR.some(c => c.id !== f.id && c.login.toLowerCase() === login.toLowerCase()) || login.toLowerCase() === MGR.login) f.err = 'Такой логин уже занят';
  else if (f.pass.length < 4) f.err = 'Пароль: минимум 4 символа';
  else {
    if (f.id) Object.assign(cr(f.id), {name, login, pass:f.pass, r1:f.r1, r2:f.r2, r3:f.r3});
    else { const id = Math.max(...COUR.map(c => c.id)) + 1; COUR.push({id, name, login, pass:f.pass, active:true, r1:f.r1, r2:f.r2, r3:f.r3}); sched[id] = emptyWeek(); TEMPLATE[id] = emptyWeek(); S.mc = id; }

}
function toggleCour(id) {
  const c = cr(id);
  if (c.active && COUR.filter(x => x.active).length === 1) return go({toast:'Нельзя отключить последнего активного курьера'});

function rv(id, s, reason) {

    <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px;pointer-events:none"><div class="tiny" style="color:#cfd8d2">Щипок или двойное касание: приблизить</div><button class="btn sm" style="pointer-events:auto" onclick="go({viewer:null})">${ic('x', 18)}</button></div>
    <div style="position:absolute;bottom:20px;left:0;right:0;display:flex;gap:10px;justify-content:center"><button class="btn sec sm" onclick="vzoom(1/1.5)">−</button><button class="btn sec sm" onclick="vzoomReset()">1:1</button><button class="btn sec sm" onclick="vzoom(1.5)">+</button></div></div>`;
}
function applyVz() {
  const im = $('vwrimg'), el = $('vwr'); if (!im || !el) return;
  const mx = (S.vz.s - 1) * el.clientWidth / 2, my = (S.vz.s - 1) * el.clientHeight / 2;
  S.vz.x = Math.max(-mx, Math.min(mx, S.vz.x)); S.vz.y = Math.max(-my, Math.min(my, S.vz.y));
  im.style.transform = `translate(${S.vz.x}px,${S.vz.y}px) scale(${S.vz.s})`;
}
function vzoom(f) { S.vz.s = Math.min(8, Math.max(1, S.vz.s * f)); if (S.vz.s === 1) { S.vz.x = 0; S.vz.y = 0; } applyVz(); }
function vzoomReset() { S.vz = {s:1, x:0, y:0}; applyVz(); }
function bindViewer() {
  const el = $('vwr'); if (!el) return;
  applyVz();
  const pts = new Map(); let base = null, lastTap = 0;
  const snap = () => ({s:S.vz.s, x:S.vz.x, y:S.vz.y, pts:[...pts.values()].map(p => ({x:p.x, y:p.y}))});
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    el.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); base = snap();
    if (pts.size === 1) {
      const t = Date.now();
      if (t - lastTap < 300) { S.vz = S.vz.s > 1.2 ? {s:1, x:0, y:0} : {s:2.5, x:0, y:0}; applyVz(); base = snap(); }
      lastTap = t;
    }
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !base) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const cur = [...pts.values()];
    if (cur.length >= 2 && base.pts.length >= 2) {
      const d0 = Math.hypot(base.pts[0].x - base.pts[1].x, base.pts[0].y - base.pts[1].y) || 1, d1 = Math.hypot(cur[0].x - cur[1].x, cur[0].y - cur[1].y);
      S.vz.s = Math.min(8, Math.max(1, base.s * d1 / d0));
    } else if (cur.length === 1 && base.pts.length === 1 && S.vz.s > 1) {
      S.vz.x = base.x + cur[0].x - base.pts[0].x; S.vz.y = base.y + cur[0].y - base.pts[0].y;
    }
    if (S.vz.s === 1) { S.vz.x = 0; S.vz.y = 0; }
    applyVz();
  });
  const up = e => { pts.delete(e.pointerId); base = snap(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); vzoom(e.deltaY < 0 ? 1.2 : 1 / 1.2); }, {passive:false});
}

/* ===================== СОХРАНЕНИЕ ДАННЫХ И СЕССИИ ===================== */
// данные и вход хранятся в памяти приложения, поэтому после сворачивания и закрытия вход не слетает.
// DATA_VER нужно увеличивать при каждом изменении структуры данных, иначе сохранённые старые данные не подойдут.
const DATA_VER = 1, STORE_KEY = 'angara_kofe_data';
const replaceObj = (t, s) => { Object.keys(t).forEach(k => delete t[k]); Object.assign(t, s); };
const replaceArr = (t, s) => { t.length = 0; s.forEach(x => t.push(x)); };
function snapshotData() {
  const refOf = item => { for (const c of COUR) for (let d = 0; d < 7; d++) { const i = L(c.id, d).indexOf(item); if (i >= 0) return [c.id, d, i]; } return null; };
  return JSON.stringify({
    v:DATA_VER, nid, CITY, P, sched, TEMPLATE, COUR, MGR, WH, DEPOT, WATER, CHAT, LOADED, PASS,
    reviews:reviews.map(r => Object.assign({}, r, {ref:r.ref ? refOf(r.ref) : null})),
    NOTIFS:NOTIFS.map(n => Object.assign({}, n, {rv:n.rv ? n.rv.id : undefined})),
    sess:{role:S.role, me:S.me, mc:S.mc, tab:S.tab, day:S.day, flt:S.flt}
  }, (k, v) => k === 'loc' ? undefined : v);
}
function restoreData(txt) {
  const d = JSON.parse(txt);
  if (d.v !== DATA_VER) return false;
  replaceArr(P, d.P); P.forEach(p => p.units.forEach(u => { u.loc = p; }));
  replaceObj(sched, d.sched); replaceObj(TEMPLATE, d.TEMPLATE); replaceArr(COUR, d.COUR);
  Object.assign(MGR, d.MGR); replaceObj(WH, d.WH); Object.assign(DEPOT, d.DEPOT); Object.assign(WATER, d.WATER);
  replaceObj(CHAT, d.CHAT); replaceObj(LOADED, d.LOADED); replaceObj(PASS, d.PASS);
  reviews.length = 0; d.reviews.forEach(r => { const f = r.ref; r.ref = f ? L(f[0], f[1])[f[2]] : null; reviews.push(r); });
  NOTIFS.length = 0; d.NOTIFS.forEach(n => { n.rv = n.rv !== undefined && n.rv !== null ? reviews.find(r => r.id === n.rv) : undefined; NOTIFS.push(n); });
  nid = d.nid; CITY = d.CITY;
  if (d.sess && d.sess.role && (d.sess.role === 'mgr' || cr(d.sess.me))) Object.assign(S, d.sess, {view:null, sheet:null, cam:null, shade:false});
  return true;
}
function saveAll() { try { localStorage.setItem(STORE_KEY, snapshotData()); } catch (e) {} }
let saveT = 0;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveAll, 400); }
window.appSave = saveAll;
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
addEventListener('pagehide', saveAll);
/* ===================== ОБНОВЛЕНИЕ ПО ИНТЕРНЕТУ ===================== */
// Android-оболочка сама проверяет сервер обновлений при запуске и сообщает сюда через window.onUpdateState
const UPD = {state:null, banner:false};
window.onUpdateState = s => {
  try { s = typeof s === 'string' ? JSON.parse(s) : s; } catch (e) { return; }
  if (s.kind === 'content' && s.version <= APP_VERSION) s = {kind:'none'};   // эта версия уже открыта
  UPD.state = s;
  if ((s.kind === 'content' || s.kind === 'apk') && s.ready) UPD.banner = true;
  render(true);
};
function updCheck() {
  UPD.state = {kind:'checking'}; render(true);
  try { AndroidBridge.checkUpdates(); } catch (e) { UPD.state = {kind:'error', msg:'Обновления работают только в установленном приложении'}; render(true); }
}
function updApply() {
  UPD.banner = false;
  try { if (UPD.state && UPD.state.kind === 'apk') { UPD.state = {kind:'downloading'}; render(true); AndroidBridge.installApk(); } else AndroidBridge.applyUpdate(); } catch (e) {}
}
function updBlock() {
  const s = UPD.state, has = !!window.AndroidBridge;
  let st = has ? 'Приложение проверяет обновления при каждом запуске.' : 'Обновления работают в установленном приложении.';
  let btn = has ? `<button class="btn sec" style="margin-top:8px" onclick="updCheck()">Проверить обновления</button>` : '';
  if (s) {
    if (s.kind === 'checking') st = 'Проверяем наличие обновлений…';
    else if (s.kind === 'none') st = 'У вас последняя версия.';
    else if (s.kind === 'error') st = esc(s.msg || 'Не удалось проверить обновления.');
    else if (s.kind === 'downloading') st = 'Скачиваем обновление…';
    else if (s.kind === 'content') { st = `Доступна версия ${s.version}${s.notes ? ': ' + esc(s.notes) : ''}`; btn = `<button class="btn" style="margin-top:8px" onclick="updApply()">Обновить сейчас</button>`; }
    else if (s.kind === 'apk') { st = `Доступна новая версия приложения ${s.version}${s.notes ? ': ' + esc(s.notes) : ''}`; btn = `<button class="btn" style="margin-top:8px" onclick="updApply()">Скачать и установить</button>`; }
  }
  return `<h3>Обновления</h3><div class="card"><div class="kv"><span>Версия приложения</span><b>${APP_VERSION}</b></div><div class="tiny" style="margin-top:6px">${st}</div>${btn}</div>`;
}
function updBanner() {
  const s = UPD.state;
  if (!UPD.banner || !s || (s.kind !== 'content' && s.kind !== 'apk')) return '';
  return `<div style="position:absolute;left:12px;right:12px;bottom:74px;background:#16301f;border:1px solid var(--g);border-radius:14px;padding:11px 12px;z-index:9"><div class="t1" style="font-size:14px">${s.kind === 'apk' ? 'Доступна новая версия приложения' : 'Доступно обновление'} ${s.version}</div>${s.notes ? `<div class="t2">${esc(s.notes)}</div>` : ''}<div class="btns" style="margin:8px 0 0"><button class="btn sm" onclick="updApply()">${s.kind === 'apk' ? 'Скачать и установить' : 'Обновить'}</button><button class="btn sec sm" onclick="UPD.banner=false;render(true)">Позже</button></div></div>`;
}
// после обновления сообщаем об этом при первом запуске новой версии
try { const lv = +(localStorage.getItem('angara_kofe_ver') || 0); if (lv && lv < APP_VERSION) S.toast = 'Приложение обновлено до версии ' + APP_VERSION; localStorage.setItem('angara_kofe_ver', String(APP_VERSION)); } catch (e) {}

const ACC_KEY = 'angara_kofe_accounts';
let ACCS = [];
try { ACCS = JSON.parse(localStorage.getItem(ACC_KEY) || '[]'); if (!Array.isArray(ACCS)) ACCS = []; } catch (e) { ACCS = []; }
function saveAccs() { try { localStorage.setItem(ACC_KEY, JSON.stringify(ACCS)); } catch (e) {} }
try { const txt = localStorage.getItem(STORE_KEY); if (txt && !restoreData(txt)) localStorage.removeItem(STORE_KEY); } catch (e) { try { localStorage.removeItem(STORE_KEY); } catch (e2) {} }
render();
</script>
</body>
