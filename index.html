<style>

a.mapbtn{display:block;text-decoration:none;color:var(--tx)}

.big{font-size:26px;font-weight:800}
.login{flex:1;display:flex;flex-direction:column;padding:26px;gap:12px;overflow-y:auto}
.login>:first-child{margin-top:auto}.login>:last-child{margin-bottom:auto}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}
/* ===== Стиль iPhone: шрифт, скругления, стекло, пружинные нажатия, анимации ===== */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.card{border-radius:18px;border:1px solid rgba(255,255,255,.07)}
.btn{border-radius:14px}.btn.sm{border-radius:12px}
input[type=text],input[type=password]{border-radius:12px;border-color:rgba(255,255,255,.09)}
.kv,.chk{border-bottom-color:rgba(255,255,255,.07)}
.sheet{border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.top h1{font-size:var(--fs,28px);font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .22s ease}
.top .sub{max-height:60px;overflow:hidden;transition:opacity .2s,max-height .22s,margin .2s}
.top.nt,.top.nt *{transition:none !important}
.top.sc{background:rgba(14,20,17,.82);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(255,255,255,.07);z-index:4}
.top.sc h1{font-size:min(19px,var(--fs,28px))}
.top.sc .sub:not(:has(.back)){opacity:0;max-height:0;margin:0}
.tabs{position:relative;z-index:6;background:rgba(17,26,21,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.08)}
.body{overflow-x:hidden;margin-bottom:calc(-1 * var(--tabh,0px));padding-bottom:calc(var(--tabh,0px) + 16px)}
.btn,.tabs button,.bell,.logout,.chips button,.days button,.seg button,.step button,.back,.sendb{transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .15s,background .2s}
.btn:active,.bell:active,.logout:active,.chips button:active,.days button:active,.seg button:active,.step button:active,.sendb:active{transform:scale(.95)}
.tabs button b{transition:transform .25s cubic-bezier(.3,1.7,.5,1)}.tabs button:active b{transform:scale(.84)}
.card[onclick]{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}.card[onclick]:active{transform:scale(.985);background:var(--card2)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* сообщения: короткие пузыри с «хвостиком» у последнего в серии */
.msg{position:relative;isolation:isolate;margin:2px 0;border-radius:18px;padding:8px 12px}
.msg.tail{margin-bottom:9px}
.msg.me{border-bottom-right-radius:18px}.msg.them{border-bottom-left-radius:18px}
.msg.me.tail{border-bottom-right-radius:6px}.msg.them.tail{border-bottom-left-radius:6px}
.msg.me.tail::before{content:"";position:absolute;bottom:0;right:-6px;width:18px;height:16px;background:var(--g2);border-bottom-left-radius:16px 12px;z-index:-1}
.msg.me.tail::after{content:"";position:absolute;bottom:0;right:-26px;width:26px;height:16px;background:var(--bg);border-bottom-left-radius:10px;z-index:-1}
.msg.them.tail::before{content:"";position:absolute;bottom:0;left:-6px;width:18px;height:16px;background:var(--card2);border-bottom-right-radius:16px 12px;z-index:-1}
.msg.them.tail::after{content:"";position:absolute;bottom:0;left:-26px;width:26px;height:16px;background:var(--bg);border-bottom-right-radius:10px;z-index:-1}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.msgin{animation:msgin .34s cubic-bezier(.22,1,.36,1)}.msg.me.msgin{transform-origin:100% 100%}.msg.them.msgin{transform-origin:0 100%}
.sendb{width:38px;height:38px;border-radius:50%;border:0;background:var(--g);color:#06150c;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.sendb.off{background:#2d3d34;color:#6f8a7a}
@keyframes ring{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.2);opacity:0}}
.sw{width:51px;height:31px;border-radius:16px;background:#3a433e;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--g)}.sw.on::after{transform:translateX(20px)}
.rings{display:flex;justify-content:space-around;padding:14px 8px}

.rg span{font-size:11.5px;color:var(--mut)}

#app.enter .rgp{animation:rgfill .95s cubic-bezier(.22,1,.36,1) both}
.sl-host{position:relative}
.sl-host>button{position:relative;z-index:1}
.sl-host>button.on{background:transparent !important;border-color:transparent !important}
.sl-pill{position:absolute;z-index:0;border-radius:10px;background:var(--g2);border:1px solid var(--g);pointer-events:none;transition:left .32s cubic-bezier(.3,1.25,.5,1),top .3s,width .3s,height .3s}
.chips .sl-pill{border-radius:20px}.seg .sl-pill{border-radius:8px}
@keyframes drawchk{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

function pickImage(max, cb, capture) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; if (capture) inp.setAttribute('capture', 'environment');   // capture: сразу камера телефона
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); go({toast:'Не удалось открыть изображение'}); };
    img.src = url;
  };
  document.body.appendChild(inp); inp.click();
}

function cropFit() {   // держим фото так, чтобы оно всегда закрывало рамку

  const el = $('cropimg'); if (!el) return;

  el.style.transform = `translate(calc(-50% + ${c.x}px), calc(-50% + ${c.y}px))`;

function rv(id, s, reason) {

let OBN = 0, OBBUSY = false;

  if (OBBUSY || !SY.on || !SY.net) return; OBBUSY = true;
  obAll().then(list => {
    OBN = list.length; netPill(); list.sort((a, b) => a.ts - b.ts);
    const next = i => {
      if (i >= list.length) { OBBUSY = false; return; }
      const it = list[i];
      uploadMedia(it.blob, it.type).then(f => { it.md.f = f; sendMediaMsg(it.th, it.md, true); return obDel(it.id).then(() => { OBN = Math.max(0, OBN - 1); netPill(); next(i + 1); }); })
        .catch(e => { if (e.net) { OBBUSY = false; return; } obDel(it.id).then(() => { OBN = Math.max(0, OBN - 1); netPill(); go({toast: 'Вложение не отправлено: ' + (e.message || 'ошибка')}); next(i + 1); }); });
    };

  }).catch(() => { OBBUSY = false; });
}
