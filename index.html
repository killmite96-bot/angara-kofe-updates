<style>

a.mapbtn{display:block;text-decoration:none;color:var(--tx)}

.big{font-size:26px;font-weight:800}
.login{flex:1;display:flex;flex-direction:column;padding:26px;gap:12px;overflow-y:auto}
.login>:first-child{margin-top:auto}.login>:last-child{margin-bottom:auto}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}
/* ===== Стиль iPhone: шрифт, скругления, стекло, пружинные нажатия, анимации ===== */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.card{border-radius:18px;border:1px solid rgba(255,255,255,.07)}
.btn{border-radius:14px}.btn.sm{border-radius:12px}
input[type=text],input[type=password]{border-radius:12px;border-color:rgba(255,255,255,.09)}
.kv,.chk{border-bottom-color:rgba(255,255,255,.07)}
.sheet{border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.top h1{font-size:var(--fs,28px);font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .22s ease}
.top .sub{max-height:60px;overflow:hidden;transition:opacity .2s,max-height .22s,margin .2s}
.top.nt,.top.nt *{transition:none !important}
.top.sc{background:rgba(14,20,17,.82);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(255,255,255,.07);z-index:4}
.top.sc h1{font-size:min(19px,var(--fs,28px))}
.top.sc .sub:not(:has(.back)){opacity:0;max-height:0;margin:0}
.tabs{position:relative;z-index:6;background:rgba(17,26,21,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.08)}
.body{overflow-x:hidden;margin-bottom:calc(-1 * var(--tabh,0px));padding-bottom:calc(var(--tabh,0px) + 16px)}
.btn,.tabs button,.bell,.logout,.chips button,.days button,.seg button,.step button,.back,.sendb{transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .15s,background .2s}
.btn:active,.bell:active,.logout:active,.chips button:active,.days button:active,.seg button:active,.step button:active,.sendb:active{transform:scale(.95)}
.tabs button b{transition:transform .25s cubic-bezier(.3,1.7,.5,1)}.tabs button:active b{transform:scale(.84)}
.card[onclick]{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}.card[onclick]:active{transform:scale(.985);background:var(--card2)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* сообщения: короткие пузыри с «хвостиком» у последнего в серии */
.msg{position:relative;isolation:isolate;margin:2px 0;border-radius:18px;padding:8px 12px}
.msg.tail{margin-bottom:9px}
.msg.me{border-bottom-right-radius:18px}.msg.them{border-bottom-left-radius:18px}
.msg.me.tail{border-bottom-right-radius:6px}.msg.them.tail{border-bottom-left-radius:6px}
.msg.me.tail::before{content:"";position:absolute;bottom:0;right:-6px;width:18px;height:16px;background:var(--g2);border-bottom-left-radius:16px 12px;z-index:-1}
.msg.me.tail::after{content:"";position:absolute;bottom:0;right:-26px;width:26px;height:16px;background:var(--bg);border-bottom-left-radius:10px;z-index:-1}
.msg.them.tail::before{content:"";position:absolute;bottom:0;left:-6px;width:18px;height:16px;background:var(--card2);border-bottom-right-radius:16px 12px;z-index:-1}
.msg.them.tail::after{content:"";position:absolute;bottom:0;left:-26px;width:26px;height:16px;background:var(--bg);border-bottom-right-radius:10px;z-index:-1}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.msgin{animation:msgin .34s cubic-bezier(.22,1,.36,1)}.msg.me.msgin{transform-origin:100% 100%}.msg.them.msgin{transform-origin:0 100%}
.sendb{width:38px;height:38px;border-radius:50%;border:0;background:var(--g);color:#06150c;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.sendb.off{background:#2d3d34;color:#6f8a7a}
@keyframes ring{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.2);opacity:0}}
.sw{width:51px;height:31px;border-radius:16px;background:#3a433e;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--g)}.sw.on::after{transform:translateX(20px)}
.rings{display:flex;justify-content:space-around;padding:14px 8px}

.rg span{font-size:11.5px;color:var(--mut)}

#app.enter .rgp{animation:rgfill .95s cubic-bezier(.22,1,.36,1) both}
.sl-host{position:relative}
.sl-host>button{position:relative;z-index:1}
.sl-host>button.on{background:transparent !important;border-color:transparent !important}
.sl-pill{position:absolute;z-index:0;border-radius:10px;background:var(--g2);border:1px solid var(--g);pointer-events:none;transition:left .32s cubic-bezier(.3,1.25,.5,1),top .3s,width .3s,height .3s}
.chips .sl-pill{border-radius:20px}.seg .sl-pill{border-radius:8px}
@keyframes drawchk{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

// выбор картинки из галереи с уменьшением (длинная сторона до max пикселей), результат — JPEG data URL
function pickImage(max, cb, capture) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; if (capture) inp.setAttribute('capture', 'environment');   // capture: сразу камера телефона
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); go({toast:'Не удалось открыть изображение'}); };
    img.src = url;
  };
  document.body.appendChild(inp); inp.click();
}

const AV = {};   // аватарки: 'mgr' или номер курьера -> уменьшенное фото (data URL)
const logoAmber = sz => logo(sz).replace('#1F7A45', '#B7791F').replace('#BFEACB', '#FFE7B0');
function avatar(key, name, size) {
  if (key === 'mgr2' && !AV[key]) return `<div style="min-width:${size}px;width:${size}px;height:${size}px;flex:none">${logoAmber(size)}</div>`;
  const st = `min-width:${size}px;width:${size}px;height:${size}px;border-radius:50%`;
  return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(AV[key] || '') ? `<img src="${AV[key]}" alt="" style="${st};object-fit:cover;flex:none;display:block">` : `<div class="badge b1" style="${st};font-size:${Math.round(size / 2.4)}px">${esc((name || '?')[0])}</div>`;

  return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">${o.join('')}</svg>`;

function cropFit() {   // держим фото так, чтобы оно всегда закрывало рамку

  }
  if (S.sheet === 'water') {

  if (S.sheet === 'add') {

  if (REC.an) { const buf = new Uint8Array(REC.an.fftSize); REC.an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; s += x * x; } lv = Math.min(1, Math.sqrt(s / buf.length) * 3.2); }
  REC.lv.push(lv);
  const t = document.getElementById('rect'); if (t) t.textContent = fmtDur(el / 1000);
  const box = document.getElementById('reclv');
  if (box) { const n = Math.max(8, Math.floor(box.clientWidth / 5)), tail = REC.lv.slice(-n); box.innerHTML = tail.map(v => `<i style="height:${Math.round(4 + v * 30)}px"></i>`).join(''); }
  if (el >= 120000) recSend();
}

  const type = (REC.mime || 'audio/webm').split(';')[0], blob = new Blob(REC.chunks, {type});
  const N = 30, lv = REC.lv, pk = []; for (let i = 0; i < N; i++) { const a = Math.floor(i * lv.length / N), b = Math.max(a + 1, Math.floor((i + 1) * lv.length / N)); let m = 0; for (let j = a; j < b && j < lv.length; j++) m = Math.max(m, lv[j]); pk.push(Math.min(9, Math.round(m * 9))); }
  mediaSend(blob, type, {k: 'voice', d: Math.round(sec), p: pk.join('')});
}

/* ----- фото и видео ----- */
function attachPick(kind) {

  const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none';
  inp.accept = kind === 'photo' ? 'image/*' : kind === 'video' ? 'video/*' : 'image/*,video/*';
  if (kind === 'photo' || kind === 'video') inp.setAttribute('capture', 'environment');
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) attachFile(f); };
  document.body.appendChild(inp); inp.click();
}
function attachFile(f) {
  if (/^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name || '')) {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? mediaSend(b, 'image/jpeg', {k: 'photo', w: c.width, h: c.height}) : go({toast: 'Не удалось обработать фото'}), 'image/jpeg', .78);
    };
    img.onerror = () => { URL.revokeObjectURL(url); go({toast: 'Не удалось открыть фото'}); };
    img.src = url; return;
  }
  const type = f.type || (/\.mov$/i.test(f.name || '') ? 'video/quicktime' : /\.webm$/i.test(f.name || '') ? 'video/webm' : 'video/mp4');
  if (!['video/mp4', 'video/webm', 'video/quicktime'].includes(type)) return go({toast: 'Такой формат видео не поддерживается'});
  if (f.size > 28 * 1024 * 1024) return go({toast: 'Видео слишком большое: до 30 секунд'});
  const v = document.createElement('video'), url = URL.createObjectURL(f); v.preload = 'metadata'; v.muted = true;
  const fin = (d, w, h) => {
    URL.revokeObjectURL(url);
    if (d > 31) return go({toast: 'Видео длиннее 30 секунд: обрежьте его в галерее'});
    mediaSend(f, type, {k: 'video', d: Math.round(d) || 0, w: w || 0, h: h || 0});
  };
  v.onloadedmetadata = () => fin(isFinite(v.duration) ? v.duration : 0, v.videoWidth, v.videoHeight);
  v.onerror = () => fin(0, 0, 0);
  v.src = url;
}

/* ----- статусы «в сети / отошёл / не в сети» ----- */
// часы сервера: время смены и статусов ставит сервер, поэтому показываем его по часам сервера (разница с часами телефона не важна)

  fetch(SRV + '/api/ping').then(r => r.json()).then(j => { if (j && j.now) { SKEW = j.now - (t0 + Date.now()) / 2; prRefresh(); } }).catch(() => {});
}
let LASTACT = Date.now(), PRLAST = 0;
['touchstart', 'pointerdown', 'keydown', 'scroll', 'click'].forEach(ev => document.addEventListener(ev, () => { const was = Date.now() - LASTACT > 110000; LASTACT = Date.now(); if (was) { PRLAST = 0; prBeat(); } }, {passive: true, capture: true}));

}

  const age = now - r.t, idle = (r.t - (r.a || 0)) > 120000;
  if (age < 110000 && r.v && !idle) return {s: 'on', txt: 'В сети'};
  if (age < 1800000) return {s: 'aw', txt: 'Отошёл'};
  const m = Math.round(age / 60000);
  return {s: 'off', txt: 'Не в сети · был(а) в сети ' + (m < 60 ? m + ' мин' : m < 1440 ? Math.floor(m / 60) + ' ч' : 'больше суток') + ' назад'};
}
function lcText(key) {

  const p = l.pid ? pt(l.pid) : null, nm = p ? '«' + p.name + '»' : '';

}

const prShort = key => { const i = prInfo(key); return i.s === 'on' ? 'в сети' : i.s === 'aw' ? 'отошёл' : 'не в сети'; };

  if (s && new Date(s.s).toDateString() === new Date(sNow()).toDateString()) h += `<div class="tiny">${s.e ? 'Смена: ' + hm(s.s) + '–' + hm(s.e) + ' · ' + durTxt(Math.round((s.e - s.s) / 60000)) : 'На смене с ' + hm(s.s) + ' · ' + durTxt(Math.round((sNow() - s.s) / 60000))}</div>`;

/* ----- переписка всегда прижата к последнему сообщению, пока вы не прокрутили её вверх сами ----- */
let CHATPIN = true, CHATTH = null;
function chatPinNow() { [0, 150, 350, 700].forEach(t => setTimeout(() => { const b = document.querySelector('#app .body'); if (b && CHATPIN && S.tab === 'chat' && S.th && !S.view) b.scrollTop = b.scrollHeight; }, t)); }
let CHATRO = null;
function kbOn(on) { const app = $('app'); if (!app || app.classList.contains('kb') === on) return; app.classList.toggle('kb', on); if (on && S.tab === 'chat' && S.th) { CHATPIN = true; chatPinNow(); } }
document.addEventListener('focusin', e => { const t = e.target; if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName) && t.type !== 'checkbox' && t.type !== 'file' && t.type !== 'button' && t.closest && t.closest('#app')) kbOn(true); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) kbOn(false); }, 140));
function kbCheck() { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) kbOn(false); }   // поле ввода пропало при перерисовке: клавиатура закрыта, вкладки возвращаются
function chatStick() {
  const body = document.querySelector('#app .body');
  if (CHATRO) { try { CHATRO.disconnect(); } catch (e) {} CHATRO = null; }
  if (S.tab !== 'chat' || !S.th || S.view || !body) { CHATTH = null; return; }
  if (window.ResizeObserver) { CHATRO = new ResizeObserver(() => { if (CHATPIN) body.scrollTop = body.scrollHeight; }); CHATRO.observe(body); }   // пока окно меняет высоту (клавиатура, панель вкладок), список остаётся прижатым к последнему сообщению без рывков
  if (CHATTH !== S.th) { CHATTH = S.th; CHATPIN = true; }
  body.onscroll = () => { CHATPIN = body.scrollHeight - body.scrollTop - body.clientHeight < 120; };
  chatPinNow();
}

/* ----- качество определения прибытия за 60 дней (обезличенные счётчики, без координат) ----- */
function geoStatSheet() {
  const days = Object.keys(GSD).sort(), cs = {}, ps = {};
  days.forEach(d => {
    const v = GSD[d] || {};
    Object.keys(v.c || {}).forEach(c => { const a = cs[c] = cs[c] || {}; Object.keys(v.c[c]).forEach(f => { a[f] = (a[f] || 0) + v.c[c][f]; }); });
    Object.keys(v.p || {}).forEach(p => { const a = ps[p] = ps[p] || {}; Object.keys(v.p[p]).forEach(f => { a[f] = /x$/.test(f) ? Math.max(a[f] || 0, v.p[p][f]) : (a[f] || 0) + v.p[p][f]; }); });
  });
  let h = `<h2>Качество геолокации</h2><div class="t2" style="margin-bottom:8px">За ${days.length} дн. (счётчики хранятся 60 дней, координаты не сохраняются)</div>`;
  const cids = Object.keys(cs);
  if (!cids.length) return h + '<div class="card t2">Данных пока нет: они появятся, когда курьеры включат определение и выйдут на смену.</div><button class="btn sec" style="margin-top:10px" onclick="go({sheet:null})">Закрыть</button>';
  h += '<h3>Курьеры</h3>' + cids.map(c => {
    const a = cs[c], rq = a.rq || 0, ok = a.ok || 0, pc = rq ? Math.round(ok / rq * 100) : 0;
    return rgRow(cr(+c) ? cr(+c).name : 'Курьер ' + c, `запросов с телефона: ${rq} · «прибыл» отмечено: ${a.ar || 0} · рядом, но не в радиусе: ${a.ms || 0} · плохой GPS: ${a.la || 0}`, `<span class="pill ${pc >= 60 ? 'ok' : 'warn'}">${pc}%</span>`);
  }).join('');
  const pids = Object.keys(ps);
  if (pids.length) h += '<h3>Точки</h3>' + pids.sort((a, b) => ((ps[b].ms || 0) - (ps[a].ms || 0))).map(p => {
    const a = ps[p], ar = a.ar || 0, ms = a.ms || 0, avg = ar ? Math.round(a.ard / ar) : 0, mavg = ms ? Math.round(a.msd / ms) : 0;
    const hint = ms >= 3 && ms >= ar ? `<div class="t2" style="color:var(--o)">Часто не срабатывает у этой точки (в среднем ${mavg} м): GPS «плавает». Курьеру стоит подождать минуту у входа.</div>` : '';
    return `<div class="card" style="padding:10px 12px"><div class="row"><div class="grow"><div class="t1" style="font-size:14px">${esc(pt(+p) ? pt(+p).name : 'Точка ' + p)}</div><div class="t2">срабатывало: ${ar}${ar ? ' (в среднем ' + avg + ' м, максимум ' + a.arx + ' м)' : ''} · не сработало рядом: ${ms}${ms ? ' (в среднем ' + mavg + ' м)' : ''}</div>${hint}</div></div></div>`;
  }).join('');
  return h + '<button class="btn sec" style="margin-top:10px" onclick="go({sheet:null})">Закрыть</button>';
}

  } else {
    h = '<h2>Кто на смене</h2>' + act.map(c => { const l = L(c.id, TODAY); return `<div class="card" style="padding:10px 12px"><div class="row">${avatar(c.id, c.name, 32)}<div class="grow"><div class="t1" style="font-size:14px">${esc(c.name)}</div><div class="t2">${l.length ? l.length + ' точек сегодня' : 'Выходной'}</div><div data-mgl="${c.id}">${mglInner(c.id)}</div></div></div></div>`; }).join('');
  }
  return h + close;
}
